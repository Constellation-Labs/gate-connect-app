[package]
name = "gate-connect-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
dirs.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
json5.workspace = true
toml_edit.workspace = true

# Backs the built-in MITM proxy (`proxy` module). hudsucker mints per-host
# leaf certs from our local CA and hands decrypted requests to a handler
# that rewrites inference calls to the Gate gateway. tokio is the runtime
# the proxy engine owns on a background thread; the rest of core stays sync.
hudsucker.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
http.workspace = true
time.workspace = true

# Cognito OAuth (`oauth` module) for the app's own gateway auth. `reqwest`
# (blocking, rustls) calls the Cognito token endpoint; `sha2` + `base64`
# derive the PKCE S256 challenge; `rand` mints the verifier + CSRF state.
reqwest.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true

# CLI reverse-proxy relay (`proxy::relay`): a plaintext loopback HTTP server
# CLI tools point their base URL at, so the credential is injected live per
# request instead of baked into a config file. `hyper` (http1 server) accepts
# the tool's request; the response is forwarded to the gateway via `reqwest`
# and streamed back with `futures-util` mapping the body stream onto
# `http-body-util`'s `StreamBody`.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }

# `libc` backs the unix `getpwuid(geteuid())` username lookup in env.rs -
# we resolve the real account from the password database rather than
# trusting inherited `$USER` / `$USERNAME`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `winreg` backs the Windows proxy's system-proxy wiring, which reads and
# writes the per-user WinINET `Internet Settings` registry values.
#
# `sha1` + `pem` compute the CA cert's SHA-1 thumbprint in-process (decode the
# PEM to DER, then digest) so the trust check feeds `certutil -store Root` a
# known-good fingerprint instead of scraping certutil's locale-/encoding-
# dependent text output.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
sha1 = "0.10"
pem = "3.0"

# Test-only. The proxy end-to-end tests (`tests/proxy_e2e.rs`,
# `tests/relay_e2e.rs`) mint a throwaway CA with `rcgen`, run a tiny loopback
# mock gateway, boot the real `proxy` engine/relay, and drive a `reqwest`
# client through it to assert the rewrite + `X-Gate-*` headers reach the
# gateway. `reqwest`, `hyper`, `http-body-util`, and `bytes` are now normal
# dependencies (relay + oauth), so they aren't repeated here. None of this
# touches the OS trust store or system proxy, so it needs no elevation.
[dev-dependencies]
rcgen = "0.14"
