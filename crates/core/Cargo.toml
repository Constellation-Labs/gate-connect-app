[package]
name = "gate-connect-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
dirs.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

# Backs the built-in MITM proxy (`proxy` module). hudsucker mints per-host
# leaf certs from our local CA and hands decrypted requests to a handler
# that rewrites inference calls to the Gate gateway. tokio is the runtime
# the proxy engine owns on a background thread; the rest of core stays sync.
hudsucker.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
http.workspace = true
time.workspace = true

# `libc` backs the unix `getpwuid(geteuid())` username lookup in env.rs —
# we resolve the real account from the password database rather than
# trusting inherited `$USER` / `$USERNAME`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `winreg` backs the Windows proxy's system-proxy wiring, which reads and
# writes the per-user WinINET `Internet Settings` registry values.
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

# Test-only. The proxy end-to-end test (`tests/proxy_e2e.rs`) mints a
# throwaway CA with `rcgen`, runs a tiny loopback mock gateway (built on the
# `hyper` already in the tree, so no MSRV-fragile test framework is pulled in),
# boots the real `proxy::engine`, and drives a `reqwest` client through it to
# assert the rewrite + `X-Gate-*` headers reach the gateway. None of this
# touches the OS trust store or system proxy, so it needs no elevation.
[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
] }
rcgen = "0.14"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
