[package]
name = "gate-connect-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "gate-connect"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
gate-connect-core.workspace = true
rpassword = "7"

# Test-only. `tests/cli_flows.rs` drives the built `gate-connect` binary
# (`CARGO_BIN_EXE_gate-connect`) through login → connect → disconnect for each
# tool, pointing the core test seams (`GATE_CONNECT_TEST_HOME` /
# `GATE_CONNECT_TEST_SECRETS`) at temp dirs so the run is hermetic on every OS.
# `reqwest` parses the authorize URL and drives the loopback callback in the
# `login --oauth` test (acting as the browser).
[dev-dependencies]
tempfile = "3"
reqwest.workspace = true
# `tests/cli_flows.rs` parses the configs the CLI writes, on every platform.
serde_json.workspace = true

# Test-only, Linux only: `tests/helper_daemon.rs` drives the real helper daemon
# (`gate-connect --proxy-helper`), which exists only there. `libc` sends SIGTERM
# to that child by its PID, `rcgen` mints the throwaway CA its engine signs
# under (never trusted anywhere), and `serde_json` (above) reads the control
# frames a recording relay sees. Both are already in the lock through core.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
rcgen = "0.14"
