[package]
name = "gate-connect-forwarder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "gate-connect-forwarder"
path = "src/main.rs"

# Deliberately NOT `gate-connect-core`. The whole point of a separate binary is
# that it links none of the heavy machinery - keyring, hudsucker, reqwest - so
# it stays small, starts fast, and holds nothing worth stealing. Everything
# shared with core lives in `gate-connect-paths`, which has no dependencies of
# consequence.
#
# The one exception is a TLS *client*. The relay listener (`src/relay.rs`)
# serves relay requests itself when the engine is gone, and those arrive as
# plaintext on loopback and have to leave for the provider over TLS. It
# originates TLS only: no server side, no certificate minted, no key held. The
# three crates are already compiled in the tree through reqwest and hudsucker,
# and `Cargo.lock` resolves these requirements to those same versions, so this
# names no new code - a bump of reqwest's TLS stack has to move these with it.
# `rustls-platform-verifier` is the verifier reqwest uses, so the forwarder
# trusts exactly what the relay's own direct hop trusts, corporate roots in the
# OS store included.
[dependencies]
anyhow.workspace = true
gate-connect-paths = { path = "../paths" }
httparse = "1"
rustls = "0.23"
rustls-platform-verifier = "0.7"
# Reads `billing_mode` out of `account.json`, so a pay-as-you-go tool gets an
# error rather than a credential-less request sent to its provider.
serde_json.workspace = true
tokio = { workspace = true }
tokio-rustls = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
