[package]
name = "gate-connect-forwarder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "gate-connect-forwarder"
path = "src/main.rs"

# Deliberately NOT `gate-connect-core`. The whole point of a separate binary is
# that it links none of the heavy machinery - keyring, hudsucker, rustls,
# reqwest - so it stays small, starts fast, and holds nothing worth stealing.
# Everything shared with core lives in `gate-connect-paths`, which is ~200 lines
# and has no dependencies of consequence.
[dependencies]
anyhow.workspace = true
gate-connect-paths = { path = "../paths" }
httparse = "1"
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
