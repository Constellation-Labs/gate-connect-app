[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
# Placeholder. The real version is injected from the git tag at release time
# (see .github/workflows/release.yml "Set version from tag"); the tag is the
# single source of truth, so this is not bumped per release.
version = "0.0.0"
edition = "2021"
# Pinned to match rust-toolchain.toml (1.86.0). With resolver = "3" this
# keeps `cargo update` from pulling deps whose MSRV exceeds the toolchain.
rust-version = "1.86"
license = "Apache-2.0"
authors = ["Constellation Network"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenClaw's config (`~/.openclaw/openclaw.json`) is JSON5 — comments and
# trailing commas are allowed — so the OpenClaw integration parses it with
# `json5` (writing back is plain `serde_json`, which is valid JSON5).
json5 = "0.4"
toml_edit = "0.22"
# `dirs` resolves per-OS config / data / home directories so the core crate
# can stop hand-rolling `$HOME/Library/...` paths. `keyring` wraps the
# native secret store on each OS (Keychain / Credential Manager / Secret
# Service). Cross-target builds need each OS's native feature, plus one of
# keyring's two Secret Service clients for Linux.
#
# **`async-secret-service`, not `sync-secret-service`, and this is a crash fix.**
# The sync client is `dbus-secret-service`, which binds the C libdbus; with
# `vendored` it compiled its own copy of that C into our binary. That copy
# smashes its stack inside `_dbus_poll` (`dbus-sysdeps-unix.c:3210`, reached from
# `socket_do_iteration`) and aborts the process. Measured on Ubuntu 24.04: 3 of 5
# launches died, at one to seven seconds, whenever the real Secret Service was
# reached. `GATE_CONNECT_TEST_SECRETS` hid it entirely, which is why
# `pnpm app:local` never showed it and `pnpm app` did.
#
# The entry this replaces chose the sync client to avoid "a tokio dep". That
# reason was already stale: `hudsucker`, eight lines below, pulls tokio, which
# its own comment says is why tokio appears here at all.
#
# `async-secret-service` is the pure-Rust client (`secret-service` + `zbus`), so
# no C library is compiled or linked. Three things follow, all checked against
# keyring 3.6.3 rather than assumed:
#
# - **The API stays synchronous.** keyring's backend wraps
#   `secret_service::blocking::*`, so `Entry` is still sync and `keychain.rs`
#   needs no change. "async" names the transport, not our call sites.
# - **`async-io`, not `tokio`, for the runtime.** One is required. `tokio` makes
#   zbus use tokio, and a blocking call from inside a tokio runtime panics -
#   which `#[tauri::command(async)]` handlers would do. `async-io` is
#   self-contained.
# - **`vendored` is dropped because it becomes inert.** It expands to
#   `dbus-secret-service?/vendored` + `openssl?/vendored`, and with `crypto-rust`
#   neither of those crates is in the tree.
dirs = "5"
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "async-secret-service",
  "crypto-rust",
  "async-io",
] }
# The built-in MITM proxy . `hudsucker` is a Rust MITM
# proxy that mints per-host certs from a local CA and lets us rewrite the
# inference request in-process; default features give us the rcgen-backed
# CA + a rustls client. The `http2` feature lets the MITM speak HTTP/2 to
# both the app and the gateway - Anthropic's API and Claude Desktop/Cowork
# negotiate h2, and without it hudsucker forces HTTP/1.1, which breaks those
# clients. It pulls an async stack (tokio/hyper/rustls), which is why
# `tokio` appears here despite the rest of core being sync. `rcgen` is
# re-exported by hudsucker, so we don't depend on it directly.
hudsucker = { version = "0.24", features = ["http2"] }
# The engine's own TLS client to the gateway. hudsucker's
# `with_rustls_connector` hardcodes webpki roots with no way to add one, so we
# build the connector ourselves to honour `GATE_CONNECT_TEST_CA` - the seam the
# relay already has. Features mirror hudsucker's own hyper-rustls exactly (plus
# `http2`, which its `http2` feature turns on), so this names a crate already
# compiled in the tree rather than pulling anything new. `webpki-roots` is the
# same 1.x hyper-rustls resolves to. PEM parsing comes from rustls-pki-types via
# hudsucker's `rustls` re-export, so it needs no entry of its own.
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1",
  "http2",
  "logging",
  "tls12",
  "webpki-tokio",
] }
webpki-roots = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "time",
  "macros",
  # `proxy enable --foreground` parks on SIGINT/SIGTERM so a service manager can
  # stop it and have the system proxy restored on the way down.
  "signal",
] }
# Surfaces hudsucker's internal TLS/HTTP2 errors to stderr when
# GATE_PROXY_DEBUG is set, so MITM handshake failures are diagnosable.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Needed by the custom certificate authority (proxy::cert_authority): `http`
# for the `Authority` type in hudsucker's CertificateAuthority trait, `time`
# for leaf cert validity. Both are already in the tree via hyper/rcgen; naming
# them here lets us reference the exact same types.
http = "1"
time = "0.3"
serde_yaml = "0.9"
gate-connect-core = { path = "crates/core" }
# OAuth (Cognito) support in the shipped binary. `reqwest` (blocking, rustls,
# no OpenSSL) calls the Cognito `/oauth2/token` endpoint; `sha2` + `base64`
# derive the PKCE S256 challenge; `rand` mints the verifier and CSRF state.
# The async client + `stream` feature also drive the CLI reverse-proxy relay
# (`proxy::relay`), which streams upstream responses back to the tool.
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
  "json",
  "stream",
] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
# Backs `tool_watch`, the filesystem watch behind the `tools-changed` event: a
# tool installed while a window is open is the one reading the frontend cannot
# be told about, and this replaces the 5s detection poll both shells used to
# run. Native backend per OS (inotify / FSEvents / ReadDirectoryChangesW);
# default features, which is the fsevent backend on macOS and std channels
# everywhere - no crossbeam, no async runtime.
notify = "8"
