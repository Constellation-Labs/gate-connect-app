[package]
name = "gate-connect-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "gate_connect_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gate-connect-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
anyhow.workspace = true
gate-connect-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tauri = { version = "~2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-process = "2.3.1"
url = "2"

# Public AppKit/QuartzCore window code in src/lib.rs: NSPanel promotion, rounded
# corners, and the global click monitor (objc2-app-kit + block2). No private API.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSResponder", "block2"] }
block2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"

# The UI-e2e harness (`examples/ui-harness.rs`) only. `tauri/test` brings in the
# mock runtime, which hosts the real command table with no window and no
# WebDriver; keeping it a dev-dependency is what keeps it out of shipped builds.
# hyper/bytes are already direct dependencies of gate-connect-core at these
# versions, so the harness adds nothing to the dependency graph `cargo audit`
# screens.
[dev-dependencies]
tauri = { version = "~2.11", features = ["tray-icon", "image-png", "test"] }
tokio = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
