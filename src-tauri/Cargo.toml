[package]
name = "gate-connect-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "gate_connect_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "gate-connect-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
anyhow.workspace = true
gate-connect-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "~2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-process = "2.3.1"
url = "2"

# Public AppKit/QuartzCore window code in src/lib.rs: NSPanel promotion, rounded
# corners, and the global click monitor (objc2-app-kit + block2). No private API.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSResponder", "block2"] }
block2 = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
