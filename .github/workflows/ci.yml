name: CI

# Continuous checks for the Gate Connect Tauri app. The Rust job runs on
# all three desktop platforms so the platform-gated modules (Cowork
# variants, proxy managers, CA modules) actually compile in CI; platform
# bundles are built by release.yml on version tags.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (workspace)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # rust-toolchain.toml pins channel 1.86.0 with rustfmt + clippy
      # (same as release.yml).
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # fmt is platform-independent; run it once (the Windows runners'
      # git autocrlf setting can also produce false CRLF diffs there).
      - name: rustfmt
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  web:
    name: Web (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs `tsc --noEmit && vite build`, so this covers
      # the type check as well.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
