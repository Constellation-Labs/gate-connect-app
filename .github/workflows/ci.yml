name: CI

# Continuous checks for the Gate Connect Tauri app. The Rust job runs on
# all three desktop platforms so the platform-gated modules (proxy
# managers, CA modules, system-proxy backends) actually compile in CI;
# platform bundles are built by release.yml on version tags.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (workspace)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      # rust-toolchain.toml pins channel 1.88.0 with rustfmt + clippy
      # (same as release.yml).
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Key by the exact image: the cache would otherwise be shared with
          # jobs on other ubuntu versions (same runner OS), and objects
          # compiled against a newer glibc fail to link on 22.04.
          key: ${{ matrix.os }}

      # fmt is platform-independent; run it once (the Windows runners'
      # git autocrlf setting can also produce false CRLF diffs there).
      # `externalBin` makes the Tauri build script resolve the forwarder
      # sidecar, and `src-tauri/binaries/` is gitignored - so clippy and test
      # both fail on a clean checkout without this. The app's own build stages
      # it from `beforeDevCommand`/`beforeBuildCommand`; a bare `cargo` run has
      # no such hook.
      # Invoked directly rather than through `pnpm stage:sidecar`. This job sets
      # up Rust and nothing else, so `pnpm` is not on its PATH and the step
      # exited 127 on all three runners. The script is plain bash over `cargo`
      # and `rustc`, so there is nothing for Node to do here - and `shell: bash`
      # is what makes the Windows runner use Git Bash rather than pwsh.
      - name: Stage the forwarder sidecar
        shell: bash
        run: bash scripts/stage-sidecar.sh
      - name: rustfmt
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  # Nothing else screens the dependency graph. This change swapped the Linux
  # secret-store backend and moved the lock by 381 lines - 22 crates in, 7 out -
  # with no gate that would have noticed an advisory against any of them.
  #
  # Advisories only: `cargo audit` fails the job on a RUSTSEC vulnerability and
  # merely warns on unmaintained/yanked crates, which is the line worth blocking
  # a merge on. It reads `Cargo.lock` and never builds, so it costs seconds and
  # does not need the Linux GTK stack.
  #
  # The five advisories this found on its first run all predate it and are
  # ignored in `.cargo/audit.toml`, which says for each one what pulls it, how
  # reachable it is, and what fixes it. Read that file before adding a sixth:
  # the point of the job is that a NEW advisory turns it red.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit

  # The one path CI could not otherwise see. `proxy trust-ca --system-trust`
  # writes the LocalMachine Root store, and nothing else in CI exercises it:
  # the real-tools suite skips the Windows engine phase for the listener bug,
  # and the workspace tests only typecheck the cfg-gated module.
  #
  # It needs no engine, no mocks and no login, so the listener bug does not
  # block it - `status` reads CA trust straight from `ca::is_trusted()`.
  #
  # Measured before it was built (throwaway probe, since deleted): on this
  # runner the per-user `certutil -user -addstore Root` the app uses blocks on
  # the trust dialog until killed, `Cert:\CurrentUser\Root` and the raw
  # X509Store do too, and `certutil -addstore -f Root` into LocalMachine lands
  # the cert in under a second with no dialog. The runner is already admin, so
  # elevation is not in the way. That last mechanism is what this job asserts
  # stays true - hence the bounds below: the regression to fear is the dialog
  # coming back, and a dialog does not fail, it waits.
  win-system-trust:
    name: Windows machine-wide CA trust
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-system-trust

      - name: Build the CLI
        run: cargo build --locked -p gate-connect-cli

      - name: Trust round-trip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $CN   = 'Gate Connect Local CA'
          $cli  = Join-Path $PWD 'target\debug\gate-connect.exe'
          $work = Join-Path $env:RUNNER_TEMP 'gc-system-trust'
          New-Item -ItemType Directory -Force -Path "$work\home", "$work\secrets" | Out-Null
          # The CA cert and key go to a throwaway home; the store write is the
          # only thing here that touches the real machine.
          $env:GATE_CONNECT_TEST_HOME    = "$work\home"
          $env:GATE_CONNECT_TEST_SECRETS = "$work\secrets"

          # Every call is bounded, and a timeout is a failure. 60s is ~60x the
          # measured install, and the dialog this guards against blocked the
          # probe for as long as it was given.
          function Invoke-Bounded([string]$file, [string[]]$argv, [int]$sec = 60) {
            $psi = New-Object Diagnostics.ProcessStartInfo
            $psi.FileName = $file
            foreach ($a in $argv) { $psi.ArgumentList.Add($a) }
            $psi.UseShellExecute        = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError  = $true
            $p = [Diagnostics.Process]::Start($psi)
            # Read both pipes before waiting: a child that fills one while we
            # block on exit would deadlock instead of reporting.
            $out = $p.StandardOutput.ReadToEndAsync()
            $err = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit($sec * 1000)) {
              try { $p.Kill($true) } catch {}
              return @{ ok = $false; timedout = $true; text = "(timed out after ${sec}s)" }
            }
            return @{ ok = ($p.ExitCode -eq 0); timedout = $false; text = ($out.Result + $err.Result) }
          }

          $fail = 0
          function Check([string]$what, [bool]$cond, [string]$detail = '') {
            if ($cond) {
              Write-Host "PASS: $what"
            } else {
              Write-Host "FAIL: $what"
              if ($detail) { Write-Host ($detail -replace '(?m)^', '    ') }
              $script:fail++
            }
          }

          $before = Invoke-Bounded $cli @('proxy', 'status')
          Check 'status starts untrusted' ($before.text -match 'CA trust: not trusted') $before.text

          $trust = Invoke-Bounded $cli @('proxy', 'trust-ca', '--system-trust')
          Check 'trust-ca --system-trust returns, with no dialog' ((-not $trust.timedout) -and $trust.ok) $trust.text

          # Which store it landed in is the whole point: the per-user one is
          # what prompts, so an install that went there would be the regression
          # rather than the feature.
          Check 'the CA is in the LocalMachine Root store' (Invoke-Bounded 'certutil' @('-store', 'Root', $CN) 30).ok
          Check 'the CA is not in the per-user Root store' (-not (Invoke-Bounded 'certutil' @('-user', '-store', 'Root', $CN) 30).ok)

          # The half that used to be missing: a store lookup sees only the store
          # it is pointed at, so before this PR a machine-wide install still read
          # as untrusted here and every enable re-prompted.
          $after = Invoke-Bounded $cli @('proxy', 'status')
          Check 'status sees the machine-wide install as trusted' ($after.text -match 'CA trust: trusted') $after.text

          $untrust = Invoke-Bounded $cli @('proxy', 'untrust-ca', '--system-trust')
          Check 'untrust-ca --system-trust returns, with no dialog' ((-not $untrust.timedout) -and $untrust.ok) $untrust.text
          Check 'the CA is gone from the LocalMachine Root store' (-not (Invoke-Bounded 'certutil' @('-store', 'Root', $CN) 30).ok)

          $end = Invoke-Bounded $cli @('proxy', 'status')
          Check 'status reports it untrusted again' ($end.text -match 'CA trust: not trusted') $end.text

          if ($fail -gt 0) { Write-Host "$fail check(s) failed"; exit 1 }

      # A run that fails midway can leave the root installed. The runner is
      # throwaway, but a machine-wide root is not the kind of thing to leave
      # lying around on the strength of that.
      - name: Remove the CA from the machine store
        if: always()
        shell: pwsh
        run: |
          certutil -delstore Root "Gate Connect Local CA" 2>&1 | Out-Null
          exit 0

  web:
    name: Web (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs `tsc --noEmit && vite build`, so this covers
      # the type check as well.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # The e2e specs live outside `tsconfig.json`'s `include`, so `pnpm build`
      # never sees them.
      - name: Type check e2e
        run: pnpm typecheck:e2e

      # Chromium only: playwright.config.ts declares one project, and the
      # popover ships in one webview per platform - none of which is Chromium,
      # so a browser matrix would buy nothing here.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Drives the real frontend against a fake Tauri backend (e2e/install.ts).
      # The Rust side is covered by the `rust` job above and by
      # e2e-real-tools.yml.
      #
      # The live suite is NOT here. It has its own config file, because
      # Playwright resolves `webServer` per config and never per project: as a
      # project it started the Rust harness on this job too, which has no Rust
      # toolchain and no webkit deps, and the failure arrived as a webServer
      # timeout. `ui-e2e` below owns it.
      - name: E2E (UI)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The seam neither other suite covers: a CLICK in the real frontend reaching
  # the real Rust command, and the real backend's state deciding what the UI
  # then shows. `web` drives the frontend against a fake backend; `rust` and
  # e2e-real-tools.yml drive the backend with no UI.
  #
  # Three OSes because that is the whole point - the commands under test fork on
  # the platform (the engine is in-process on macOS/Windows and a detached
  # helper daemon on Linux), and a suite that only proved it on ubuntu would
  # miss exactly the divergence worth testing.
  #
  # No WebDriver and no display: `src-tauri/examples/ui-harness.rs` hosts the
  # app's own command table on `tauri::test`'s mock runtime and answers IPC over
  # loopback, so the browser is Playwright's Chromium on every runner. Read that
  # file's header for what that covers and what it cannot.
  ui-e2e:
    name: UI e2e, live backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-ui-e2e

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `externalBin` in tauri.conf.json: the desktop crate's build script will
      # not resolve without it, and `src-tauri/binaries/` is gitignored.
      - name: Stage the forwarder sidecar
        shell: bash
        run: bash scripts/stage-sidecar.sh

      # Built here rather than left to the webServer, so a compile failure reads
      # as a compile failure instead of as a harness that never came up.
      - name: Build the UI harness
        run: cargo build --locked -p gate-connect-desktop --example ui-harness

      # `--with-deps` installs the system libraries Chromium needs, and is
      # Ubuntu-only; elsewhere the browser download is all that is wanted.
      - name: Install Playwright browser
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            pnpm exec playwright install --with-deps chromium
          else
            pnpm exec playwright install chromium
          fi

      # `GATE_UI_HARNESS_ROUTING=1` is consent for this runner to install a root
      # CA, which `manager::enable()` requires and which therefore gates the
      # routing arc (the boot specs run either way). `ci/e2e/ui-harness.sh`
      # installs it promptlessly with `sudo -n`, which works here and not on a
      # desktop - see that script and e2e/live/routing.spec.ts.
      - name: E2E (UI vs live backend)
        run: pnpm test:e2e:live
        env:
          GATE_UI_HARNESS_ROUTING: "1"

      # A run that fails midway can leave the root installed. The runner is
      # throwaway, but a machine-wide root is not the kind of thing to leave
      # lying around on the strength of that - the same reasoning, and the same
      # `if: always()`, as `win-system-trust` above.
      # The paths go through cygpath on Windows: `gate-connect.exe` is a native
      # binary and cannot read the `/c/...` form Git Bash hands it, so the
      # untrust ran against a home that did not exist and left the root
      # installed while reporting success.
      #
      # It does not fail the job - the tests' verdict is the job's - but it says
      # loudly what happened, because a silent `|| true` is how a machine-wide
      # root survives a run nobody looked at.
      - name: Remove the CA from the machine store
        if: always()
        shell: bash
        run: |
          native() { if [ "$RUNNER_OS" = "Windows" ]; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          W="${TMPDIR:-/tmp}/gc-ui-e2e"
          CLI="target/debug/gate-connect"
          [ -x "$CLI" ] || CLI="$CLI.exe"
          if [ ! -x "$CLI" ]; then
            echo "::warning::gate-connect CLI not built; nothing to untrust"
            exit 0
          fi
          export GATE_CONNECT_TEST_HOME="$(native "$W/home")"
          export GATE_CONNECT_TEST_SECRETS="$(native "$W/secrets")"
          "$CLI" proxy disable || echo "note: proxy disable failed (may not have been on)"
          if "$CLI" proxy untrust-ca --system-trust; then
            echo "CA removed from the machine store"
          else
            echo "::warning::could not remove the Gate CA from this runner's trust store"
          fi
          exit 0

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live-${{ matrix.os }}
          path: playwright-report/
          retention-days: 7
