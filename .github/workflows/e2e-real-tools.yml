name: E2E (real tools)

# Installs the real claude / codex / opencode / openclaw / hermes CLIs, points each at a local
# HTTPS mock gateway through the normal `gate-connect connect` flow, fires one
# headless request, and asserts the mock received it with the X-Gate-Api-Key /
# X-Gate-Upstream-Url headers. It mutates the runner's trust store and depends
# on third-party CLIs whose flags and auth shapes drift - so it is NOT a
# required check (don't gate merges on it). Each tool fails independently and
# the captured-request assertion is the source of truth.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  e2e:
    name: real-tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-e2e

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build gate-connect CLI
        run: cargo build -p gate-connect-cli

      # Codex relies on the OS trust store for a custom CA; that works on Linux
      # and Windows but not macOS (it ignores the keychain), so skip installing
      # it there.
      - name: Install AI CLIs
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm install -g @anthropic-ai/claude-code opencode-ai openclaw
          else
            npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai openclaw
          fi

      # Hermes is a Python agent installed via its own script (pulls uv, Python,
      # ripgrep, ffmpeg, …). The installer targets Unix shells and provisions a
      # portable Git Bash on Windows, and every step here runs under
      # `shell: bash`, so it runs on all three runners. run.sh guards the hermes
      # run on `command -v hermes`, so if a runner's install lands the binary
      # off PATH it skips cleanly instead of failing.
      - name: Install Hermes
        shell: bash
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # shell: bash forces Git Bash on the Windows runner (default there is pwsh).
      # timeout-minutes bounds the step so a hung tool can't run for hours; on
      # timeout the runner kills the process tree and the diagnostics step below
      # still runs (if: always()), flushing the checkpoint + tool output files.
      - name: Run real-tools e2e
        id: e2e
        shell: bash
        timeout-minutes: 8
        run: bash ci/e2e/run.sh

      - name: Diagnostics (checkpoints + tool output)
        if: always()
        shell: bash
        run: |
          W="$RUNNER_TEMP/gc-e2e"
          [ "$RUNNER_OS" = "Windows" ] && W="$(cygpath -u "$RUNNER_TEMP")/gc-e2e"
          echo "=== diag.log (checkpoints) ==="; cat "$W/diag.log" 2>/dev/null || echo "(none)"
          for f in "$W"/*.out; do
            [ -f "$f" ] || continue
            echo "=== $(basename "$f") ==="; cat "$f" 2>/dev/null
          done
