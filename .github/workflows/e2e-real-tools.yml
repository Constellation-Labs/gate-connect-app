name: E2E (real tools)

# Installs the real claude / codex / opencode / openclaw / hermes CLIs and drives
# the full relay path: `gate-connect proxy serve` hosts the loopback relay,
# `gate-connect connect` points each CLI at it over plaintext http, the CLI fires
# one headless request, and the relay injects the Gate credential + forwards over
# TLS to a local HTTPS mock gateway. Runs twice - once signed in with an API key
# (asserts X-Gate-Api-Key) and once via OAuth (asserts X-Gate-Authorization +
# X-Gate-Org-Id) - since both auth modes must keep working. Depends on
# third-party CLIs whose flags and auth shapes drift, so it is NOT a required
# check (don't gate merges on it). Each tool fails independently and the
# captured-request assertion is the source of truth.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  e2e:
    name: real-tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-e2e

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build gate-connect CLI
        run: cargo build -p gate-connect-cli

      # Every CLI now talks to the relay over plaintext loopback, so codex no
      # longer needs the OS trust store for a custom CA (the old macOS blocker,
      # openai/codex#9526); install it on all platforms.
      - name: Install AI CLIs
        shell: bash
        run: npm install -g @anthropic-ai/claude-code @openai/codex opencode-ai openclaw

      # Hermes is a Python agent installed via the bash install.sh, which
      # symlinks the launcher to ~/.local/bin/hermes; --skip-browser drops the
      # Playwright/chromium download we don't need for a `-z ping` run.
      # Windows is intentionally skipped: install.ps1 has no browser-skip switch,
      # so it always runs an unbounded Playwright/Chromium install that stalls
      # the runner. Hermes is cross-platform and fully exercised on Linux+macOS;
      # run.sh's `command -v hermes` guard skips it cleanly on Windows.
      - name: Install Hermes (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-browser
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # shell: bash forces Git Bash on the Windows runner (default there is pwsh).
      # timeout-minutes bounds the step so a hung tool can't run for hours; on
      # timeout the runner kills the process tree and the diagnostics step below
      # still runs (if: always()), flushing the checkpoint + tool output files.
      - name: Run real-tools e2e
        id: e2e
        shell: bash
        timeout-minutes: 8
        run: bash ci/e2e/run.sh

      - name: Diagnostics (checkpoints + tool output)
        if: always()
        shell: bash
        run: |
          W="$RUNNER_TEMP/gc-e2e"
          [ "$RUNNER_OS" = "Windows" ] && W="$(cygpath -u "$RUNNER_TEMP")/gc-e2e"
          echo "=== diag.log (checkpoints) ==="; cat "$W/diag.log" 2>/dev/null || echo "(none)"
          for f in "$W"/*.out; do
            [ -f "$f" ] || continue
            echo "=== $(basename "$f") ==="; cat "$f" 2>/dev/null
          done
