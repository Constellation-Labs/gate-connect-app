name: E2E (real tools)

# Installs the real claude / codex / opencode / openclaw / hermes CLIs and drives
# the full relay path: `gate-connect proxy serve` hosts the loopback relay,
# `gate-connect connect` points each CLI at it over plaintext http, the CLI fires
# one headless request, and the relay injects the Gate credential + forwards over
# TLS to a local HTTPS mock gateway. Runs twice - once signed in with an API key
# (asserts X-Gate-Api-Key) and once via OAuth (asserts X-Gate-Authorization +
# X-Gate-Org-Id) - since both auth modes must keep working. The third-party CLIs
# are pinned below so their drift cannot move this check on a PR that did not
# bump them, and run.sh fails any expected harness that did not pass, so a skip
# cannot pass for green: that is what makes it fit to be a required check. Each
# tool fails independently and the captured-request assertion is the source of
# truth.
on:
  pull_request:
  # feat/new-app-ui too: its merges are what ships next, and gate's weekly
  # last_verified refresh counts only push/schedule/dispatch runs, never
  # pull_request ones. Drop it when #151 merges and main is the only branch.
  push:
    branches: [main, feat/new-app-ui]
    # A release tag always runs the suite; the guard below never skips it.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      alert:
        description: Post to Slack if this run fails, as the nightly does (to test the alert)
        type: boolean
        default: false
      force:
        description: Run the suite even if this commit already passed (AG-902 guard)
        type: boolean
        default: false
  # Nightly at 06:00 UTC. GitHub fires `schedule` from the default branch only,
  # so this starts running when it reaches main; a failure posts to Slack (the
  # `alert` job below). Third-party CLIs are pinned, so a red night means our
  # code or a model/vendor change, not a silent CLI upgrade.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  # AG-902: a schedule fires whether or not the branch moved, so a quiet day
  # would rebuild and re-test a commit that already passed. Only schedule and
  # workflow_dispatch are guarded; pull_request (the real-tools checks are
  # required there), push and v* tags always run. ci/run-guard.sh holds the
  # rules: run on a new commit, after a failed suite, past the 7-day floor, or
  # with `force`. e2e runs unless the guard says exactly "false", so a guard
  # that errors fails open into a full run rather than a silent skip.
  guard:
    name: run guard
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run || 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          sparse-checkout: ci/run-guard.sh
          sparse-checkout-cone-mode: false
      - name: Decide
        id: guard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: e2e-real-tools.yml
          # Runs on this branch are the proof. feat/new-app-ui until #151
          # merges (plan decision 1b), then main: flip this one value.
          GUARD_BRANCH: feat/new-app-ui
          HEAD_SHA: ${{ github.sha }}
          SUITE_JOB_PREFIX: 'real-tools ('
          FORCE: ${{ inputs.force == true }}
        run: bash ci/run-guard.sh

  e2e:
    name: real-tools (${{ matrix.os }})
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.run != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-e2e

      - uses: actions/setup-node@v4
        with:
          # openclaw requires node >=22.19; on Node 20 npm silently skips its
          # install, so it was inert on every runner. 22 keeps the other CLIs
          # happy too.
          node-version: 22

      - name: Build gate-connect CLI
        run: cargo build --locked -p gate-connect-cli

      # Every CLI now talks to the relay over plaintext loopback, so codex no
      # longer needs the OS trust store for a custom CA (the old macOS blocker,
      # openai/codex#9526); install it on all platforms.
      #
      # Pinned to exact versions so a third-party release cannot turn this check
      # red (or green) on a PR that did not change. Each pin is the newest
      # release published before the last green run they were taken from
      # (2026-10-01). Bump them in their own PR, where a red run is the
      # upstream's doing and says so. Models stay unpinned on purpose: run.sh
      # resolves them at runtime because pinned model ids get retired.
      #
      # OpenClaw is the exception to "newest release": every 2026.9.x requires
      # Node >=24.16, and this job runs Node 22. Unpinned, npm quietly fell
      # back to the newest release whose `engines` accept Node 22 - the
      # extended-stable line - so that is what every green run tested, and it
      # is what is pinned. Moving to 2026.9.x means moving the job to Node 24.
      - name: Install AI CLIs
        shell: bash
        run: >-
          npm install -g
          @anthropic-ai/claude-code@2.1.286
          @openai/codex@0.159.3
          opencode-ai@1.18.34
          openclaw@2026.8.35

      # Hermes is a Python agent installed via the bash install.sh, which
      # symlinks the launcher to ~/.local/bin/hermes; --skip-browser drops the
      # Playwright/chromium download we don't need for a `-z ping` run.
      # Windows is intentionally skipped: install.ps1 has no browser-skip switch,
      # so it always runs an unbounded Playwright/Chromium install that stalls
      # the runner. Hermes is cross-platform and fully exercised on Linux+macOS;
      # run.sh's `command -v hermes` guard skips it cleanly on Windows.
      #
      # Pinned twice, like the npm CLIs above: the installer script is fetched
      # from the repo at one commit rather than from the vendor's site, and
      # `--commit` makes it check out that same commit (it refuses one that is
      # not on main). Unpinned, install.sh clones the tip of main, so an
      # upstream break turns this job red on PRs that touch nothing here
      # (96c64b45 did on 2026-10-06). Bump the SHA deliberately, after a newer
      # commit is seen to install cleanly.
      - name: Install Hermes (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          HERMES_COMMIT: 80cf5183f8ed812e8814b244e3ea6e72661d228a
        run: |
          curl -fsSL "https://raw.githubusercontent.com/NousResearch/hermes-agent/$HERMES_COMMIT/scripts/install.sh" \
            | bash -s -- --skip-browser --commit "$HERMES_COMMIT"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # shell: bash forces Git Bash on the Windows runner (default there is pwsh).
      # timeout-minutes bounds the step so a hung tool can't run for hours; on
      # timeout the runner kills the process tree and the diagnostics step below
      # still runs (if: always()), flushing the checkpoint + tool output files.
      - name: Run real-tools e2e
        id: e2e
        shell: bash
        timeout-minutes: 8
        # Claude Code's background auto-updater could replace the pinned global
        # install mid-job; keep the version this run tests the one pinned above.
        env:
          DISABLE_AUTOUPDATER: 1
        run: bash ci/e2e/run.sh

      # run.sh writes the per-tool outcome as JSON; keep it on the run so the
      # gateway can read which tools passed without parsing logs. Missing when
      # the script died before its end, which readers treat as not verified.
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-tools-result-${{ matrix.os }}
          path: ${{ runner.temp }}/gc-e2e/real-tools-result.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Diagnostics (checkpoints + tool output)
        if: always()
        shell: bash
        run: |
          W="$RUNNER_TEMP/gc-e2e"
          [ "$RUNNER_OS" = "Windows" ] && W="$(cygpath -u "$RUNNER_TEMP")/gc-e2e"
          echo "=== diag.log (checkpoints) ==="; cat "$W/diag.log" 2>/dev/null || echo "(none)"
          for f in "$W"/*.out; do
            [ -f "$f" ] || continue
            echo "=== $(basename "$f") ==="; cat "$f" 2>/dev/null
          done

  # AG-673 AC3: a failed nightly reaches named people. Runs only for the
  # schedule, or a manual run with `alert` ticked, so PR failures stay on the PR.
  # Posts to #gate-alerts-staging through SLACK_ALERTS_WEBHOOK_URL (AG-1038),
  # not SLACK_WEBHOOK_URL, which is release notes. A missing secret fails this
  # job by name: a skipped alert would look exactly like a quiet night.
  alert:
    name: nightly alert
    needs: e2e
    if: >-
      always() && needs.e2e.result == 'failure' &&
      (github.event_name == 'schedule' || inputs.alert == true)
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    env:
      WEBHOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
      # Slack member ids: matheus.reis, Gabriel Claramunt.
      MENTIONS: <@U0AEQU9KJ80> <@U07P0BLK1M3>
    steps:
      - name: Post failure to Slack
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then
            echo "::error::SLACK_ALERTS_WEBHOOK_URL is not set; the failure alert was not sent (AG-1038)."
            exit 1
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            -q '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
          text="$MENTIONS Real-tools e2e failed on \`$GITHUB_REF_NAME\` (${GITHUB_SHA:0:7}): ${failed:-see run}. <$run_url|Open the run>"
          jq -n --arg text "$text" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
