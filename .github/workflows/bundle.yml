name: Bundle

# The platform bundle build, shared by release.yml and ci.yml so a pull request
# builds the same artifact a tag ships (AG-905).
#
# `release: true` is release.yml's call and nothing else's: it stamps the tag's
# version, signs, notarizes, and uploads to the draft release, reading secrets
# that release.yml hands over with `secrets: inherit`. ci.yml calls this with
# `release: false` and passes no secrets at all, so a pull request (a fork's
# included) builds with none in reach. The release-only steps carry
# `if: inputs.release`, and the build itself is two steps rather than one with
# blank secrets: an APPLE_CERTIFICATE set to the empty string is still set, and
# the bundler would try to import it.
#
# What a CI bundle leaves out, all of it on purpose: the signature and the
# notarization (no secrets), updater artifacts (they need the signing key), the
# PostHog key, the Cognito client config, and the version stamp (no tag). Each
# leg uploads its installers as `bundle-<platform>` for later jobs to install.
#
# No `permissions:` on the job: a called job inherits its caller's, and asking
# for `contents: write` here would fail a pull request's call outright.

on:
  workflow_call:
    inputs:
      release:
        description: 'Sign, notarize and upload to the draft release for this tag. release.yml only.'
        type: boolean
        default: false
      macos_universal:
        description: 'Build the macOS universal binary (Apple Silicon and Intel). false builds Apple Silicon only, about half the compile. Ignored on a release, which is always universal.'
        type: boolean
        default: true

jobs:
  bundle:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `--locked` on every leg: these are the artefacts that ship, and
          # without it cargo is free to resolve something the reviewed
          # `Cargo.lock` does not name. CI builds gained it alongside the
          # advisory gate; a release built off a lock nobody screened would
          # walk straight past both.
          #
          # It goes after `--` because it is cargo's flag, not Tauri's:
          # `tauri build` has no `--locked`, and passes anything after the
          # separator to the runner. Putting it before would fail the build on
          # an unexpected argument - and until AG-905 this build only ran on a
          # tag, so nothing before the release itself would have said so.
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin -- --locked'
          - platform: 'ubuntu-22.04'
            args: '-- --locked'
          - platform: 'windows-latest'
            args: '-- --locked'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libnss3-tools
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      # Pinned to 1.88.0 to match rust-toolchain.toml - the macOS targets
      # must be added to the same toolchain cargo actually builds with.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          # Apple Silicon only when a CI caller asks for it: the runner is
          # Apple Silicon, so that build is native and the Intel half (a
          # cross-compile, then lipo) is skipped. A release is always universal.
          targets: ${{ matrix.platform == 'macos-latest' && ((inputs.release || inputs.macos_universal) && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'aarch64-apple-darwin') || '' }}
      # Skipped on a release, which keeps the release build cold as it was
      # before this workflow was shared: inside a called workflow GITHUB_JOB is
      # `bundle` for both callers, so a tag would otherwise restore the cache
      # main's CI bundle saved. Only main and feat/new-app-ui save, as for the
      # other Rust caches (#475): each PR leg saving its own ~2 GB evicts the
      # base caches, the only ones a PR can restore from.
      - uses: swatinem/rust-cache@v2
        if: ${{ !inputs.release }}
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/new-app-ui' }}
      - run: pnpm install --frozen-lockfile
      # The git tag is the single source of truth for the app version. Source
      # files carry a 0.0.0 placeholder; stamp the real version (tag minus the
      # leading "v") into tauri.conf.json so the bundle filenames and the
      # updater's latest.json version match the release. jq ships on all
      # GitHub-hosted runners.
      - name: Set version from tag
        if: inputs.release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          echo "Stamped version $VERSION into tauri.conf.json"
      # macOS notarization uses an App Store Connect API key. The .p8 is stored
      # as a base64 secret; decode it to a file the bundler reads via
      # APPLE_API_KEY_PATH. Only macOS notarizes, so skip it on the other runners.
      - name: Write App Store Connect API key (macOS)
        if: inputs.release && matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" | openssl base64 -d -A > "$RUNNER_TEMP/apple-api-key.p8"
      - name: Build, sign & release
        if: inputs.release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing + notarization (macOS only; these are inert on the
          # Linux/Windows runners). The signing cert is the base64 .p12; the
          # bundler imports it into a temporary keychain. APPLE_SIGNING_IDENTITY
          # is passed explicitly because tauri.conf.json pins signingIdentity to
          # "-" (ad-hoc) for local builds, and that config value would otherwise
          # win over the cert. Notarization authenticates with the App Store
          # Connect API key written above.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
          # Inlined into the frontend bundle by Vite (beforeBuildCommand). Absent
          # ⇒ analytics stays a no-op, so the build still succeeds without it.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          # Inlined the same way. A tag with a `-` suffix is a pre-release, and
          # only a pre-release lists the staging and dev gateways
          # (GATEWAY_SERVERS in src/lib/config.ts). The same expression marks
          # the GitHub release `prerelease` below, so the bundle and the
          # release agree on what they are.
          VITE_GATE_PRERELEASE: ${{ contains(github.ref_name, '-') }}
          # Cognito OAuth client config, baked into the binary at compile time
          # via `option_env!` (crates/core/src/oauth.rs). Public client config,
          # not secrets, so these are repo Variables. Absent ⇒ the app falls
          # back to the legacy API-key flow. GATE_COGNITO_SCOPES is optional;
          # the code defaults to "openid email profile aws.cognito.signin.user.admin".
          # All three pools are baked in; the app picks prod, staging or dev at
          # runtime by the selected gateway host (STAGING_GATEWAY_HOST and
          # DEV_GATEWAY_HOST in account.rs).
          GATE_COGNITO_HOSTED_DOMAIN: ${{ vars.GATE_COGNITO_HOSTED_DOMAIN }}
          GATE_COGNITO_CLIENT_ID: ${{ vars.GATE_COGNITO_CLIENT_ID }}
          GATE_COGNITO_SCOPES: ${{ vars.GATE_COGNITO_SCOPES }}
          GATE_COGNITO_HOSTED_DOMAIN_STAGING: ${{ vars.GATE_COGNITO_HOSTED_DOMAIN_STAGING }}
          GATE_COGNITO_CLIENT_ID_STAGING: ${{ vars.GATE_COGNITO_CLIENT_ID_STAGING }}
          GATE_COGNITO_SCOPES_STAGING: ${{ vars.GATE_COGNITO_SCOPES_STAGING }}
          GATE_COGNITO_HOSTED_DOMAIN_DEV: ${{ vars.GATE_COGNITO_HOSTED_DOMAIN_DEV }}
          GATE_COGNITO_CLIENT_ID_DEV: ${{ vars.GATE_COGNITO_CLIENT_ID_DEV }}
          GATE_COGNITO_SCOPES_DEV: ${{ vars.GATE_COGNITO_SCOPES_DEV }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gate Connect ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform below.'
          # GitHub prepends releaseBody to the auto-generated notes (grouped by
          # merged PRs). Only the matrix leg that CREATES the draft triggers
          # generation; the other legs find and reuse the existing draft.
          generateReleaseNotes: true
          releaseDraft: true
          # A pre-release is kept out of /releases/latest, which is what the
          # updater reads, so a stable install can never auto-update into a
          # build that offers staging and dev. Publishing an `-rc` draft as
          # Latest by hand used to be one click away from exactly that.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
      # The same action, the same matrix args, none of the secrets. The one
      # override is `createUpdaterArtifacts`: with it on, the bundler refuses to
      # finish without TAURI_SIGNING_PRIVATE_KEY, and the updater archives are
      # only meaningful signed. It is a file rather than inline JSON because
      # tauri-action splits `args` on quotes, and absolute so it does not
      # depend on which directory the CLI resolves it from. It goes before `--`, which
      # hands the rest to cargo. No tagName, so tauri-action uploads nothing.
      - name: Build (unsigned)
        if: ${{ !inputs.release }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config ${{ github.workspace }}/src-tauri/tauri.unsigned.conf.json ${{ (matrix.platform == 'macos-latest' && !inputs.macos_universal) && '--target aarch64-apple-darwin -- --locked' || matrix.args }}
      # Tauri's AppImage bundler pulls libwayland-client/cursor/egl/server
      # into the AppDir via the GTK/WebKit dependency chain, even though
      # libGL/libEGL themselves are correctly excluded (tauri-apps/tauri
      # #11988, #8929). The bundled libwayland-egl doesn't speak the host
      # compositor's Wayland protocol version, so EGL display creation
      # fails and the window renders blank on newer distros (confirmed on
      # Ubuntu 26 with WEBKIT_DISABLE_DMABUF_RENDERER having no effect,
      # since the failure happens before WebKit picks a renderer).
      #
      # Fix: strip the bundled copies so the dynamic loader falls back to
      # the system libwayland, repack, then re-sign (release only) - on a
      # release the tauri-action step above already signed the pre-strip
      # file, and its signature won't match the patched bytes.
      #
      # libdbus-1 is stripped for the same reason and rides along here.
      # Un-vendoring libdbus-sys (see the `keyring` entry in the root
      # Cargo.toml) made libdbus-1.so.3 a NEEDED of the binary, so the bundler
      # can now sweep it into the AppDir - and the host copy is exactly what
      # that change was for: the vendored build was compiled without
      # `HAVE_POLL` and aborted the process. Shipping a bundled one would be a
      # different copy of the same mistake. Harmless if the bundler did not
      # pick it up: the `rm -f` is a no-op then.
      #
      # Writing that signature into latest.json does NOT belong here. Every
      # matrix leg's tauri-action uploads its own latest.json, so a leg that
      # finishes later overwrites whatever this one wrote: on v0.2.0 this step
      # patched the manifest by 03:00:43 and the macOS leg replaced it at
      # 03:01:42, putting the pre-strip signature back with nothing to notice.
      # The re-signed signature leaves here as an artifact instead, and the
      # `manifest` job applies it once every leg has finished.
      #
      # The fix runs on a CI bundle too, since it changes what ships. The
      # signing and the upload are the next step, release only.
      - name: Fix bundled host libraries in AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="target/release/bundle/appimage"
          APPIMAGE=$(ls "$BUNDLE"/*.AppImage)
          NAME=$(basename "$APPIMAGE")

          curl -fsSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null)

          (cd "$BUNDLE" && "./$NAME" --appimage-extract >/dev/null)
          rm -f "$BUNDLE"/squashfs-root/usr/lib/libwayland-*.so*
          rm -f "$BUNDLE"/squashfs-root/usr/lib/libdbus-1.so*

          # Bundle certutil, which the .deb gets from its libnss3-tools
          # dependency and the AppImage has no way to ask for. Without it
          # `ca_linux::ensure_trusted_nss` cannot write ~/.pki/nssdb, so Chrome
          # and every Electron app reject each intercepted host with a
          # certificate error while curl and the system store are happy.
          #
          # The binary and its NSS/NSPR libraries go in a private directory
          # behind a wrapper, NOT in usr/lib: everything there is on the
          # LD_LIBRARY_PATH of the app and whatever it spawns, and a browser
          # launched from the app would load this 22.04 NSS in place of its
          # own. The wrapper REPLACES LD_LIBRARY_PATH rather than prepending,
          # so certutil sees only these libraries plus the host's glibc and
          # sqlite. libsoftokn3/libfreebl3 are dlopen'd from beside libnss3,
          # which is why every .so from both packages comes along, not just
          # what ldd lists. `usr/bin` leads the AppImage's PATH, so the
          # `Command::new("certutil")` lookup finds the wrapper unchanged.
          NSS_DIR="$BUNDLE/squashfs-root/usr/lib/nss-tools"
          mkdir -p "$NSS_DIR"
          cp /usr/bin/certutil "$NSS_DIR/certutil"
          dpkg -L libnss3 libnspr4 | grep -E '\.so(\.[0-9]+)*$' | xargs -I{} cp -P {} "$NSS_DIR/"
          cat > "$BUNDLE/squashfs-root/usr/bin/certutil" <<'WRAPPER'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")/../lib/nss-tools"
          LD_LIBRARY_PATH="$here" exec "$here/certutil" "$@"
          WRAPPER
          chmod +x "$BUNDLE/squashfs-root/usr/bin/certutil"

          # Prove the bundled copy works on its own before shipping it: a
          # database created, a root added with the trust flags the app uses,
          # and read back. Any missing library fails here rather than on a
          # user's machine, where the only symptom is a browser cert error.
          NSS_TEST=$(mktemp -d)
          "$BUNDLE/squashfs-root/usr/bin/certutil" -N -d "sql:$NSS_TEST" --empty-password
          "$BUNDLE/squashfs-root/usr/bin/certutil" -A -d "sql:$NSS_TEST" -t "C,," -n probe \
            -i /etc/ssl/certs/ISRG_Root_X1.pem
          "$BUNDLE/squashfs-root/usr/bin/certutil" -L -d "sql:$NSS_TEST" -n probe -a >/dev/null
          rm -rf "$NSS_TEST"
          echo "Bundled certutil verified"

          rm -f "$APPIMAGE"
          ARCH=x86_64 /tmp/squashfs-root/AppRun "$BUNDLE/squashfs-root" "$APPIMAGE"
      - name: Re-sign and upload the fixed AppImage
        if: inputs.release && matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUNDLE="target/release/bundle/appimage"
          APPIMAGE=$(ls "$BUNDLE"/*.AppImage)
          NAME=$(basename "$APPIMAGE")

          pnpm exec tauri signer sign "$APPIMAGE"

          # Upload under the name the API actually stores. GitHub replaces
          # spaces in asset names with dots, so the bundle's "Gate
          # Connect_<v>_amd64.AppImage" lands as "Gate.Connect_...", but gh
          # derives the asset name from the local basename and matches
          # --clobber against that literal. Uploading the spaced path looks
          # for an asset that never exists, so the pre-strip file tauri-action
          # uploaded moments ago survives - and this step still exits 0. Only
          # a re-run exposes it (on a first attempt there is nothing to
          # clobber yet), which is how v0.2.0 shipped a pre-strip AppImage.
          SANITIZED=${NAME// /.}
          cp "$APPIMAGE" "/tmp/$SANITIZED"
          cp "$APPIMAGE.sig" "/tmp/$SANITIZED.sig"
          gh release upload "$TAG" "/tmp/$SANITIZED" "/tmp/$SANITIZED.sig" --clobber

          cp "$APPIMAGE.sig" "$RUNNER_TEMP/appimage.sig"

          # Read back what the release now serves, rather than trusting that
          # the uploads landed. A lost upload here hands every AppImage user a
          # window that aborts on EGL, with a signature and manifest that
          # agree with the broken binary so the updater installs it happily -
          # a silent failure this step exists to prevent, so it must be fatal.
          EXPECTED_SIZE=$(stat -c%s "$APPIMAGE")
          PUBLISHED_SIZE=$(gh release view "$TAG" --json assets \
            -q ".assets[] | select(.name == \"$SANITIZED\") | .size")
          if [ "$PUBLISHED_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "$SANITIZED is published at ${PUBLISHED_SIZE:-no such asset} bytes," \
              "expected $EXPECTED_SIZE (the stripped build)" >&2
            exit 1
          fi
          echo "Verified $SANITIZED is published at $EXPECTED_SIZE bytes (stripped)"
      # The signature only becomes authoritative once the `manifest` job writes
      # it, so fail loudly here rather than letting that job start without it.
      - name: Hand the AppImage signature to the manifest job
        if: inputs.release && matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: appimage-signature
          path: ${{ runner.temp }}/appimage.sig
          if-no-files-found: error
          retention-days: 1
      # Add version-less copies of each platform's primary installer alongside
      # the versioned assets, so a stable /releases/latest/download/<name> URL
      # always resolves to the newest published release. The versioned assets
      # are kept untouched. Filenames are discovered by globbing the bundle
      # output (not reconstructed from the version), and the globs match only
      # the installer extension, so updater artifacts (.sig, latest.json,
      # *.app.tar.gz) are never copied or replaced.
      - name: Create version-less download aliases
        if: inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          # macOS builds the universal target, so its bundles live under a
          # target-specific dir; Linux/Windows use the default release dir.
          if [ "$PLATFORM" = "macos-latest" ]; then
            BUNDLE="target/universal-apple-darwin/release/bundle"
          else
            BUNDLE="target/release/bundle"
          fi

          # alias_asset <dir> <glob> <stable-name>: copy the single installer
          # matching <dir>/<glob> to <dir>/<stable-name> and upload it to the
          # same release (resolved by tag, draft included).
          alias_asset() {
            local dir="$1" pat="$2" stable="$3"
            shopt -s nullglob
            local matches=( "$dir"/$pat )
            shopt -u nullglob
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "No installer matched $dir/$pat" >&2
              exit 1
            fi
            local src="${matches[0]}"
            cp "$src" "$dir/$stable"
            gh release upload "$TAG" "$dir/$stable" --clobber
            echo "Aliased $(basename "$src") -> $stable"
          }

          case "$PLATFORM" in
            ubuntu-22.04)
              alias_asset "$BUNDLE/appimage" "*.AppImage" "Gate.Connect_amd64.AppImage"
              alias_asset "$BUNDLE/deb" "*.deb" "Gate.Connect_amd64.deb"
              ;;
            windows-latest)
              alias_asset "$BUNDLE/nsis" "*-setup.exe" "Gate.Connect_x64-setup.exe"
              ;;
            macos-latest)
              alias_asset "$BUNDLE/dmg" "*.dmg" "Gate.Connect_universal.dmg"
              ;;
          esac

      # What later jobs install. The installer each platform's users download,
      # from the same paths the alias step above reads on a release.
      - name: Upload the bundle
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
