name: App e2e spike (temporary)

# Iteration loop for the AG-905 macOS spike: reuses a bundle another run built,
# so a driver change costs a runner minute rather than a universal build.
# Deleted before the PR leaves draft; ci.yml's `app-e2e-macos` is the real job.
on:
  push:
    branches: [feat/ag-905-macos-spike]

permissions:
  contents: read
  actions: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: bundle-macos-latest
          path: bundle
          run-id: ${{ vars.AG905_BUNDLE_RUN || '38448258629' }}
          github-token: ${{ github.token }}
      - name: TCC grants on this image
        run: |
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "== $db"
            sudo sqlite3 "$db" "select service, client, auth_value from access where service in ('kTCCServiceAccessibility','kTCCServiceScreenCapture','kTCCServiceAppleEvents','kTCCServicePostEvent')" || true
          done
          sw_vers
      - name: Sign in through the installed app
        env:
          BUNDLE_DIR: ${{ github.workspace }}/bundle
          OUT: ${{ github.workspace }}/app-e2e-out
        run: bash ci/e2e/app/macos-signin.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-e2e-macos
          path: app-e2e-out/
          retention-days: 7
