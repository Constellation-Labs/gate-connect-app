name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      # Pinned to 1.86.0 to match rust-toolchain.toml - the macOS targets
      # must be added to the same toolchain cargo actually builds with.
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - run: pnpm install --frozen-lockfile
      # The git tag is the single source of truth for the app version. Source
      # files carry a 0.0.0 placeholder; stamp the real version (tag minus the
      # leading "v") into tauri.conf.json so the bundle filenames and the
      # updater's latest.json version match the release. jq ships on all
      # GitHub-hosted runners.
      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          echo "Stamped version $VERSION into tauri.conf.json"
      # macOS notarization uses an App Store Connect API key. The .p8 is stored
      # as a base64 secret; decode it to a file the bundler reads via
      # APPLE_API_KEY_PATH. Only macOS notarizes, so skip it on the other runners.
      - name: Write App Store Connect API key (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.APPLE_API_KEY_P8 }}" | openssl base64 -d -A > "$RUNNER_TEMP/apple-api-key.p8"
      - name: Build, sign & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing + notarization (macOS only; these are inert on the
          # Linux/Windows runners). The signing cert is the base64 .p12; the
          # bundler imports it into a temporary keychain. APPLE_SIGNING_IDENTITY
          # is passed explicitly because tauri.conf.json pins signingIdentity to
          # "-" (ad-hoc) for local builds, and that config value would otherwise
          # win over the cert. Notarization authenticates with the App Store
          # Connect API key written above.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
          # Inlined into the frontend bundle by Vite (beforeBuildCommand). Absent
          # ⇒ analytics stays a no-op, so the build still succeeds without it.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          # Cognito OAuth client config, baked into the binary at compile time
          # via `option_env!` (crates/core/src/oauth.rs). Public client config,
          # not secrets, so these are repo Variables. Absent ⇒ the app falls
          # back to the legacy API-key flow. GATE_COGNITO_SCOPES is optional;
          # the code defaults to "openid email profile aws.cognito.signin.user.admin".
          # Both pools are baked in; the app picks prod vs staging at runtime by
          # the selected gateway host (STAGING_GATEWAY_HOST in oauth.rs).
          GATE_COGNITO_HOSTED_DOMAIN: ${{ vars.GATE_COGNITO_HOSTED_DOMAIN }}
          GATE_COGNITO_CLIENT_ID: ${{ vars.GATE_COGNITO_CLIENT_ID }}
          GATE_COGNITO_SCOPES: ${{ vars.GATE_COGNITO_SCOPES }}
          GATE_COGNITO_HOSTED_DOMAIN_STAGING: ${{ vars.GATE_COGNITO_HOSTED_DOMAIN_STAGING }}
          GATE_COGNITO_CLIENT_ID_STAGING: ${{ vars.GATE_COGNITO_CLIENT_ID_STAGING }}
          GATE_COGNITO_SCOPES_STAGING: ${{ vars.GATE_COGNITO_SCOPES_STAGING }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Gate Connect ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform below.'
          # GitHub prepends releaseBody to the auto-generated notes (grouped by
          # merged PRs). Only the matrix leg that CREATES the draft triggers
          # generation; the other legs find and reuse the existing draft.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # Tauri's AppImage bundler pulls libwayland-client/cursor/egl/server
      # into the AppDir via the GTK/WebKit dependency chain, even though
      # libGL/libEGL themselves are correctly excluded (tauri-apps/tauri
      # #11988, #8929). The bundled libwayland-egl doesn't speak the host
      # compositor's Wayland protocol version, so EGL display creation
      # fails and the window renders blank on newer distros (confirmed on
      # Ubuntu 26 with WEBKIT_DISABLE_DMABUF_RENDERER having no effect,
      # since the failure happens before WebKit picks a renderer).
      #
      # Fix: strip the bundled copies so the dynamic loader falls back to
      # the system libwayland, repack, then re-sign - the tauri-action step
      # above already signed the pre-strip file, and its signature won't
      # match the patched bytes.
      #
      # Writing that signature into latest.json does NOT belong here. Every
      # matrix leg's tauri-action uploads its own latest.json, so a leg that
      # finishes later overwrites whatever this one wrote: on v0.2.0 this step
      # patched the manifest by 03:00:43 and the macOS leg replaced it at
      # 03:01:42, putting the pre-strip signature back with nothing to notice.
      # The re-signed signature leaves here as an artifact instead, and the
      # `manifest` job applies it once every leg has finished.
      - name: Fix bundled libwayland in AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          BUNDLE="target/release/bundle/appimage"
          APPIMAGE=$(ls "$BUNDLE"/*.AppImage)
          NAME=$(basename "$APPIMAGE")

          curl -fsSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null)

          (cd "$BUNDLE" && "./$NAME" --appimage-extract >/dev/null)
          rm -f "$BUNDLE"/squashfs-root/usr/lib/libwayland-*.so*
          rm -f "$APPIMAGE"
          ARCH=x86_64 /tmp/squashfs-root/AppRun "$BUNDLE/squashfs-root" "$APPIMAGE"

          pnpm exec tauri signer sign "$APPIMAGE"

          # Upload under the name the API actually stores. GitHub replaces
          # spaces in asset names with dots, so the bundle's "Gate
          # Connect_<v>_amd64.AppImage" lands as "Gate.Connect_...", but gh
          # derives the asset name from the local basename and matches
          # --clobber against that literal. Uploading the spaced path looks
          # for an asset that never exists, so the pre-strip file tauri-action
          # uploaded moments ago survives - and this step still exits 0. Only
          # a re-run exposes it (on a first attempt there is nothing to
          # clobber yet), which is how v0.2.0 shipped a pre-strip AppImage.
          SANITIZED=${NAME// /.}
          cp "$APPIMAGE" "/tmp/$SANITIZED"
          cp "$APPIMAGE.sig" "/tmp/$SANITIZED.sig"
          gh release upload "$TAG" "/tmp/$SANITIZED" "/tmp/$SANITIZED.sig" --clobber

          cp "$APPIMAGE.sig" "$RUNNER_TEMP/appimage.sig"

          # Read back what the release now serves, rather than trusting that
          # the uploads landed. A lost upload here hands every AppImage user a
          # window that aborts on EGL, with a signature and manifest that
          # agree with the broken binary so the updater installs it happily -
          # a silent failure this step exists to prevent, so it must be fatal.
          EXPECTED_SIZE=$(stat -c%s "$APPIMAGE")
          PUBLISHED_SIZE=$(gh release view "$TAG" --json assets \
            -q ".assets[] | select(.name == \"$SANITIZED\") | .size")
          if [ "$PUBLISHED_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "$SANITIZED is published at ${PUBLISHED_SIZE:-no such asset} bytes," \
              "expected $EXPECTED_SIZE (the stripped build)" >&2
            exit 1
          fi
          echo "Verified $SANITIZED is published at $EXPECTED_SIZE bytes (stripped)"
      # The signature only becomes authoritative once the `manifest` job writes
      # it, so fail loudly here rather than letting that job start without it.
      - name: Hand the AppImage signature to the manifest job
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: appimage-signature
          path: ${{ runner.temp }}/appimage.sig
          if-no-files-found: error
          retention-days: 1
      # Add version-less copies of each platform's primary installer alongside
      # the versioned assets, so a stable /releases/latest/download/<name> URL
      # always resolves to the newest published release. The versioned assets
      # are kept untouched. Filenames are discovered by globbing the bundle
      # output (not reconstructed from the version), and the globs match only
      # the installer extension, so updater artifacts (.sig, latest.json,
      # *.app.tar.gz) are never copied or replaced.
      - name: Create version-less download aliases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          # macOS builds the universal target, so its bundles live under a
          # target-specific dir; Linux/Windows use the default release dir.
          if [ "$PLATFORM" = "macos-latest" ]; then
            BUNDLE="target/universal-apple-darwin/release/bundle"
          else
            BUNDLE="target/release/bundle"
          fi

          # alias_asset <dir> <glob> <stable-name>: copy the single installer
          # matching <dir>/<glob> to <dir>/<stable-name> and upload it to the
          # same release (resolved by tag, draft included).
          alias_asset() {
            local dir="$1" pat="$2" stable="$3"
            shopt -s nullglob
            local matches=( "$dir"/$pat )
            shopt -u nullglob
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "No installer matched $dir/$pat" >&2
              exit 1
            fi
            local src="${matches[0]}"
            cp "$src" "$dir/$stable"
            gh release upload "$TAG" "$dir/$stable" --clobber
            echo "Aliased $(basename "$src") -> $stable"
          }

          case "$PLATFORM" in
            ubuntu-22.04)
              alias_asset "$BUNDLE/appimage" "*.AppImage" "Gate.Connect_amd64.AppImage"
              alias_asset "$BUNDLE/deb" "*.deb" "Gate.Connect_amd64.deb"
              ;;
            windows-latest)
              alias_asset "$BUNDLE/nsis" "*-setup.exe" "Gate.Connect_x64-setup.exe"
              ;;
            macos-latest)
              alias_asset "$BUNDLE/dmg" "*.dmg" "Gate.Connect_universal.dmg"
              ;;
          esac

  # Every matrix leg's tauri-action uploads its own latest.json and the leg that
  # finishes last wins. For the entries tauri-action derives from the release's
  # .sig assets that is harmless, and in fact required: the last leg to finish
  # is the only one that has seen every other leg's uploads, so pinning
  # generation to a single leg would have shipped v0.2.0 with no darwin entries
  # at all (macOS uploaded its bundles at 03:01:38, after ubuntu finished at
  # 03:00:43). What last-writer-wins does break is the one signature a leg
  # patches by hand after re-signing the stripped AppImage.
  #
  # So the patch lands here, after the matrix, where nothing can write
  # latest.json afterwards. tauri-action emits TWO keys for the AppImage - the
  # base "linux-x86_64" and the installer-qualified "linux-x86_64-appimage" -
  # and the updater plugin prefers the "-appimage" one (it searches
  # ["{os}-{arch}-{installer}", "{os}-{arch}"] and takes the first hit). Both
  # must carry the re-signed signature, or an AppImage install verifies the
  # stripped bytes against the stale pre-strip signature and fails.
  manifest:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage-signature
      - name: Write the re-signed AppImage signature into latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          SIG=$(cat appimage.sig)
          if [ -z "$SIG" ]; then
            echo "appimage.sig arrived empty" >&2
            exit 1
          fi

          gh release download "$TAG" -p latest.json -O latest.json --clobber
          jq --arg sig "$SIG" '
            .platforms |= with_entries(
              if (.value.url // "" | endswith(".AppImage"))
              then .value.signature = $sig else . end)
          ' latest.json > patched.json
          mv patched.json latest.json
          gh release upload "$TAG" latest.json --clobber

          # Read back what the release serves rather than trusting the upload.
          # Every AppImage entry gets the same signature, so `unique` collapses
          # to a single value unless an entry was missed, which fails here too.
          gh release download "$TAG" -p latest.json -O published.json --clobber
          PUBLISHED=$(jq -r '
            [.platforms[] | select((.url // "") | endswith(".AppImage")) | .signature]
            | unique | .[]
          ' published.json)
          if [ "$PUBLISHED" != "$SIG" ]; then
            echo "latest.json does not serve the re-signed AppImage signature" >&2
            exit 1
          fi
          echo "latest.json carries the re-signed AppImage signature"

  # A leg that loses its own upload still exits 0: the alias step trusts that
  # `gh release upload` returned success, and only the AppImage fix step and
  # the manifest job read anything back. So the matrix can finish green over a
  # release that is missing an installer, or serving an alias built in an
  # earlier attempt. Gate the whole thing on the draft actually carrying every
  # artifact, before a human publishes it.
  verify:
    needs: [release, manifest]
    runs-on: ubuntu-latest
    # contents: write, not read: a draft release is invisible to GITHUB_TOKEN
    # without push access, so the release list comes back with the draft
    # filtered out and the tag looks like it has no release at all.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          MODE: draft
        run: .github/scripts/verify-release-assets.sh
